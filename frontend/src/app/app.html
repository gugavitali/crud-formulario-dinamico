<main>
  <app-dynamic-form
    [formContract]="contract"
    (formSubmit)="onFormSubmit($event)"
  />

  @if (submittedData) {
    <section style="max-width: 720px; margin: 1rem auto;">
      <h3>Payload ready for Spring Boot:</h3>
      <pre>{{ submittedData | json }}</pre>
    </section>
  }
</main>
